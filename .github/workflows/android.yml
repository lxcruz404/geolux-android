# CI de GeoLux Android (06_ANDROID_SPEC §3, tarea AND-A1).
#
# Solo corre cuando cambia la app Android o el contrato que lee, y solo en
# Ubuntu: los minutos de Linux cuestan la mitad que los de Windows. El push
# se limita a las ramas de integración para que un PR no corra dos veces.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]

jobs:
  build:
    name: Pruebas y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/Geolux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain :core:build :data:testDebugUnitTest :app:assembleDebug
